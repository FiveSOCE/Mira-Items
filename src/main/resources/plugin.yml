name: MiraItems
version: 0.1.23
main: com.mira.items.MiraItemsPlugin
api-version: '1.21'
authors: [FiveS]
description: Tracked custom items with registry API, event expiry, dynamic lore and ability cooldown feedback.
depend: [MiraCore]
softdepend: [MiraEnchantments, PlaceholderAPI, LuckPerms, Essentials, MiraKits, MiraTags, MiraAirdrops, MiraPinata]

commands:
  mi:
    description: MiraItems issuance, administration and diagnostics.
    usage: /mi <player> <reward>
    aliases: [mitem, miraitem, miraitems]
    permission: miraitems.admin
    permission-message: "You do not have permission to use MiraItems."

permissions:
  miraitems.admin:
    description: Allows MiraItems administration commands.
    default: op
