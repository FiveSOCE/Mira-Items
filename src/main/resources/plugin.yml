name: MiraItems
version: 0.1.6
main: com.mira.items.MiraItemsPlugin
api-version: '1.21'
authors: [FiveS]
description: Tracked custom items with registry API, event expiry, dynamic lore and ability cooldown feedback.
depend: [MiraCore]
softdepend: [MiraEnchantments, PlaceholderAPI]

commands:
  mitem:
    description: MiraItems administration and diagnostics.
    usage: /mitem <give|token|disable|enable|check|inspect|verify|migrate|reset|addlimit|removelimit|status|test|help>
    aliases: [miraitem, miraitems, mi]
    permission: miraitems.admin

permissions:
  miraitems.admin:
    description: Allows MiraItems administration commands.
    default: op
