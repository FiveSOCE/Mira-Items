date-format: "dd/MM/yyyy"

security:
  secret: ""

mechanics:
  pyro-reset-seconds: 5
  excalibur-duration-ticks: 60
  excalibur-cooldown-ticks: 600
  lochaber-pull-strength: 1.35
  lochaber-fatigue-duration-ticks: 60
  empower-duration-ticks: 600
  empower-cooldown-ticks: 6000

integrity:
  scan-interval-ticks: 40


vouchers:
  ranks:
    # Groups containing any of these names never receive rank vouchers.
    excluded-names:
      - owner
      - admin
      - administrator
      - moderator
      - mod
      - helper
      - staff
      - developer
      - dev
      - manager
      - builder
      - support
      - trialmod
      - jrmod
      - srmod
  permissions:
    # Used only if the matching command does not expose a Bukkit permission.
    jellylegs: "jellylegs.use"
    fly: "essentials.fly"
