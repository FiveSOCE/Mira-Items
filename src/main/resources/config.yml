date-format: "dd/MM/yyyy"

security:
  secret: ""

mechanics:
  pyro-reset-seconds: 5
  excalibur-duration-ticks: 60
  excalibur-cooldown-ticks: 600
  lochaber-pull-strength: 1.35
  lochaber-fatigue-duration-ticks: 60
  empower-duration-ticks: 600
  empower-cooldown-ticks: 6000
  dark-rider-luck-level: 10
  dark-rider-luck-refresh-ticks: 60
  dark-rider-repair-cooldown-seconds: 300

# MythicArmors owns the real 3D worn geometry. Keep disabled until dark_rider.bbmodel
# has been loaded with /ma reload and the generated component keys are known.
mythic-armors:
  dark-rider:
    enabled: false
    helmet-item-model: ""
    chestplate-equipment-model: ""
    leggings-equipment-model: ""
    boots-equipment-model: ""

integrity:
  scan-interval-ticks: 40


vouchers:
  ranks:
    # Groups containing any of these names never receive rank vouchers.
    excluded-names:
      - owner
      - admin
      - administrator
      - moderator
      - mod
      - helper
      - staff
      - developer
      - dev
      - manager
      - builder
      - support
      - trialmod
      - jrmod
      - srmod
  permissions:
    # Used only if the matching command does not expose a Bukkit permission.
    jellylegs: "jellylegs.use"
    fly: "essentials.fly"
