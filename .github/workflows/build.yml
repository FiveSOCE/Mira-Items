name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraItems-0.1.10
          path: build/libs/MiraItems-0.1.10.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.10 >/dev/null 2>&1; then
            gh release upload v0.1.10 build/libs/MiraItems-0.1.10.jar --clobber
          else
            gh release create v0.1.10 build/libs/MiraItems-0.1.10.jar --target "${{ github.sha }}" --title "MiraItems v0.1.10" --notes "Prevents MiraTags LuckPerms backing groups from becoming rank vouchers and makes tag vouchers grant the configured tag permission directly."
          fi
