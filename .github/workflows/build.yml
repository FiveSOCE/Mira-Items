name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraItems-0.1.6
          path: build/libs/MiraItems-0.1.6.jar
          if-no-files-found: error

      - name: Publish v0.1.6 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.6 >/dev/null 2>&1; then
            gh release create v0.1.6 \
              build/libs/MiraItems-0.1.6.jar \
              --target "${{ github.sha }}" \
              --title "MiraItems v0.1.6" \
              --notes "Ships the signed custom rename overlay, repair and rename utility tokens, validation hardening, utility-token service registration, and admin token issuance commands that were previously source-only."
          fi
