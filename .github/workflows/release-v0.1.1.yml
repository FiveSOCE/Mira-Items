name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: be116d1af1c137f4c2cad5265eb465aba4feaf1b

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraItems-0.1.1.jar \
            --target be116d1af1c137f4c2cad5265eb465aba4feaf1b \
            --title "MiraItems v0.1.1" \
            --notes "Adds Pyro Axe combo feedback. Starting with the second consecutive valid Pyro hit on the same target, each stacked hit plays entity.wither.break_block to the attacker while the existing 1x, 2x, 4x, 8x damage chain continues normally."
