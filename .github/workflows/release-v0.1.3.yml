name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 85489a0b1c33bf760f4b48363115e9af74c6e415
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraItems-0.1.3.jar \
            --target 85489a0b1c33bf760f4b48363115e9af74c6e415 \
            --title "MiraItems v0.1.3" \
            --notes "Caps the Pyro Axe damage chain at 4x. The chain remains 1x, 2x, 4x and stays at 4x for all later chained hits until reset."
