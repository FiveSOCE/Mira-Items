name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 659de49929af08c5e30e6e4dceed4fe15c827df8
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraItems-0.1.2.jar \
            --target 659de49929af08c5e30e6e4dceed4fe15c827df8 \
            --title "MiraItems v0.1.2" \
            --notes "Pyro Axe chained hits from hit two onward now broadcast both the Wither break-block and anvil-land sounds from the target location so nearby players hear them."
